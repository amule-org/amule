name: Icons CI

on:
  push:
    branches: [ "**" ]
    paths:
      - 'src/icons/**'
      - 'src/CountryFlag*'
      - 'src/CamuleArtProvider.*'
      - 'src/MenuIcons*'
      - 'src/webapi/static/**'
      - 'src/webapi/Api.*'
      - '**/CMakeLists.txt'
      - 'cmake/**'
      - 'docs/THIRDPARTY.md'
      - 'unittests/tests/IconArtworkTest*'
      - 'unittests/curl-tests/amuleapi/32-country-flags.sh'
      - 'unittests/browser-tests/country-flags.cjs'
      - '.github/workflows/icons.yml'
      - '.github/workflows/ccpp.yml'
  pull_request:
    branches: [ "**" ]
    paths:
      - 'src/icons/**'
      - 'src/CountryFlag*'
      - 'src/CamuleArtProvider.*'
      - 'src/MenuIcons*'
      - 'src/webapi/static/**'
      - 'src/webapi/Api.*'
      - '**/CMakeLists.txt'
      - 'cmake/**'
      - 'docs/THIRDPARTY.md'
      - 'unittests/tests/IconArtworkTest*'
      - 'unittests/curl-tests/amuleapi/32-country-flags.sh'
      - 'unittests/browser-tests/country-flags.cjs'
      - '.github/workflows/icons.yml'
      - '.github/workflows/ccpp.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/master' && github.sha || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  icon-data-sync:
    name: Icon data in sync with source
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install artwork maintenance dependencies
        run: python3 -m pip install picosvg==0.23.0

      - name: Test artwork conversion, dimensions, provenance and size budget
        run: python3 src/icons/test_regenerate_artwork.py

      # src/icons/icon_data.c is regenerated from src/icons/*.png at configure
      # time when Python3 is present, so the checked-in copy is only ever
      # compiled on a Python3-less build. Nothing otherwise re-derives it, so it
      # can silently drift from the icon set (a missing/renamed icon goes
      # unnoticed until such a build). Regenerate and fail on any difference.
      - name: Regenerate icon_data.c from the icon set
        run: python3 src/icons/embed_icons.py src/icons src/icons/icon_data.c

      - name: Verify no drift
        run: |
          if ! git diff --quiet -- src/icons/icon_data.c; then
            echo "::error file=src/icons/icon_data.c::checked-in icon_data.c is out of sync with src/icons/"
            echo "Run: python3 src/icons/embed_icons.py src/icons src/icons/icon_data.c  and commit the result."
            git --no-pager diff -- src/icons/icon_data.c | head -60
            exit 1
          fi

  browser-country-flags:
    name: WebUI country flags at 1x, 2x and 3x
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/amule-artwork-browser" --no-package-lock playwright@1.62.1
          "$RUNNER_TEMP/amule-artwork-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check the actual WebUI country component and render screenshots
        env:
          NODE_PATH: ${{ runner.temp }}/amule-artwork-browser/node_modules
          AMULE_BROWSER_OUTPUT: ${{ runner.temp }}/amule-artwork-screenshots
        run: node unittests/browser-tests/country-flags.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: webui-country-flags
          path: ${{ runner.temp }}/amule-artwork-screenshots
          if-no-files-found: ignore
