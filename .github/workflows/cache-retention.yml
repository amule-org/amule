# Keeps one Actions cache per key prefix.
#
# Every ccache save key ends in `-${{ github.run_id }}` so that a run never
# collides with an earlier one -- actions/cache refuses to overwrite a key, and
# a stable key would freeze the cache at its first write. The cost is that
# nothing is ever replaced: each run mints a fresh 400-500 MB entry and the
# repo drifted to 32 GB across 139 entries against a 10 GB limit, so GitHub was
# evicting continuously and entries were being deleted before they served a
# hit.
#
# Restores key on hashFiles() but fall back through `restore-keys: <prefix>-`,
# which resolves to the newest match, so older generations are never chosen.
# Deleting them loses nothing.
#
# The cache-save-newest action now deletes a family's older generations as soon
# as it saves the new one. This workflow is the backstop, for the caches that
# action does not write (CodeQL) and for any prune it could not finish.
#
# It also deletes master runs that concurrency cancelled for a newer push.
# GitHub counts a cancelled check as a failure, so each one marked its commit red.
name: Cache retention

on:
  # After every master push, i.e. right behind the runs that write the caches
  # this prunes. Cheap: one API listing plus a handful of DELETEs, no build.
  push:
    branches:
      - master
  # As each run that cancels superseded master runs ends, for drop-superseded.
  # Prune skips these: cache-save-newest already pruned, and on a full runner
  # queue the job started hours later and freed nothing.
  #
  # A name the trigger cannot resolve, such as `C/C++ CI`, stops this workflow
  # compiling for the event, and every completion then produces a
  # startup_failure with no job and no log. Keep every entry here slash-free.
  workflow_run:
    workflows:
      - Packaging
      - clang-tidy
      - CodeQL Advanced
    types:
      - completed
  # Backstop for stretches with no merges, and a manual handle.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  prune:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-slim
    steps:
      - name: Keep only the newest cache per prefix
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api --paginate "repos/${REPO}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | [.id, .created_at, .size_in_bytes, .ref, .key] | @tsv' > caches.tsv
          DEFAULT_REF="refs/heads/$(gh api "repos/${REPO}" --jq .default_branch)"
          export DEFAULT_REF
          python3 - <<'PY' > to_delete.txt
          import re, collections, os
          rows = []
          for line in open("caches.tsv"):
              cid, created, size, ref, key = line.rstrip("\n").split("\t", 4)
              rows.append((int(cid), created, int(size), ref, key))
          # Only the default branch's entries are kept. Every save here is
          # master-only, so an entry on another ref came from a step that caches on
          # every event. Master can never restore it, and grouped with master's by
          # key, a newer copy used to get master's deleted.
          #
          # On the default branch, group by the key with its trailing run id removed.
          # A key that carries no run id forms a single-entry group and is always kept.
          #
          # The run id may be followed by an attempt number, as in CodeQL's
          # `-<run id>-<attempt>`; without that, every run is a family of its own.
          RUN_ID = re.compile(r"-(\d{6,})(?:-(\d{1,3}))?$")
          # Normalise the run id AND embedded hashes: CodeQL keys on a commit sha
          # rather than a run id, so without this each lands in its own group and
          # survives forever (5 CodeQL TRAP entries alone were 4.3 GB).
          def family(key):
              k = RUN_ID.sub("", key)
              return re.sub(r"[0-9a-f]{16,}", "<h>", k)
          # Rank by the run id in the key, not by created_at. Two master merges
          # in quick succession can finish out of order, and the later WRITE may
          # be the older COMMIT; the run id orders by when the run started, so
          # the newer commit's cache is the one kept. Falls back to the
          # timestamp for keys that carry no run id. A re-run keeps its run id and
          # bumps the attempt, so the attempt breaks the tie.
          def rank(entry):
              created, cid, size, key = entry
              m = RUN_ID.search(key)
              return (1, int(m.group(1)), int(m.group(2) or 0)) if m else (0, created)
          groups = collections.defaultdict(list)
          freed = kept = 0
          for cid, created, size, ref, key in rows:
              if ref != os.environ["DEFAULT_REF"]:
                  freed += size
                  print(cid)
                  continue
              groups[family(key)].append((created, cid, size, key))
          for prefix, entries in groups.items():
              entries.sort(key=rank, reverse=True)   # newest run first
              kept += 1
              for created, cid, size, key in entries[1:]:
                  freed += size
                  print(cid)
          print(f"::notice::keeping {kept} caches, freeing {freed/2**30:.1f} GB", file=__import__("sys").stderr)
          PY
          cat to_delete.txt | while read -r id; do
              [ -n "$id" ] || continue
              gh api -X DELETE "repos/${REPO}/actions/caches/${id}" >/dev/null 2>&1 \
                && echo "deleted $id" || echo "skip $id (already gone)"
          done
          echo "remaining: $(gh api "repos/${REPO}/actions/cache/usage" --jq '.active_caches_count') caches, \
          $(gh api "repos/${REPO}/actions/cache/usage" --jq '(.active_caches_size_in_bytes/1073741824*10|floor)/10') GB"

  drop-superseded:
    if: >-
      github.event.workflow_run.conclusion == 'cancelled' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-slim
    steps:
      - name: Delete the run if a newer push superseded it
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # A run cancelled by hand, or by a runner shortage, on the newest
          # commit has no newer run, so it stays.
          newer=$(gh api "repos/${REPO}/actions/workflows/${WORKFLOW_ID}/runs?branch=master&event=push&per_page=20" \
              --jq "[.workflow_runs[] | select(.id > ${RUN_ID} and .head_sha != \"${SHA}\")] | length")
          if [ "$newer" -gt 0 ]; then
              gh api -X DELETE "repos/${REPO}/actions/runs/${RUN_ID}"
              echo "deleted run ${RUN_ID} (${SHA})"
          else
              echo "no newer run, keeping ${RUN_ID}"
          fi
