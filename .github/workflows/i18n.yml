name: I18n CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/master' && github.sha || '' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  pofiles:
    name: Translation checks
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Installing tools
        run: sudo apt-get install gettext

      - name: Check update-po.sh
        run: python3 -m unittest discover -s scripts/tests -p 'test_update_po.py'

      - name: Check installer translation bridge
        run: python3 -m unittest discover -s packaging/windows/tests -p 'test_*.py'

      - name: Checking .po files
        run: |
          for po in po/*.po docs/man/po/*.po; do
            msgfmt --check --statistics --verbose $po
          done

  pot-sync:
    name: App catalogs in sync with source
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Installing tools
        run: sudo apt-get install -y gettext

      # Before regenerating: the regeneration itself cannot catch a source
      # file missing from POTFILES.in, because it scans that same list. The
      # catalogs come out perfectly in sync with what was scanned, while the
      # unscanned file's strings are absent from every language (#786).
      - name: POTFILES.in lists every file marking strings
        run: ./scripts/check-potfiles.sh

      - name: Regenerate pot
        run: ./scripts/update-po.sh

      # Only the template: pull requests do not commit the language catalogs,
      # which Weblate merges the template into after the merge.
      - name: Verify no real content drift
        run: |
          if ! ./scripts/check-po-drift.sh po/amule.pot; then
            echo
            echo "::error::po/amule.pot out of sync with source."
            echo "Run scripts/update-po.sh locally and commit po/amule.pot."
            exit 1
          fi

      # Not committed: what Weblate will do after the merge must still work.
      - name: Merge pot into every po and compile it
        run: |
          ./scripts/update-po.sh --all
          for po in po/*.po; do
            msgfmt --check -o /dev/null "$po"
          done

  manpages-pot-sync:
    name: Manpage catalogs in sync with English masters
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Installing tools
        run: sudo apt-get install -y gettext po4a

      - name: Regenerate manpages.pot + merge into manpages-*.po
        run: ./scripts/update-manpages-po.sh

      - name: Verify no real content drift
        run: |
          if ! ./scripts/check-po-drift.sh docs/man/po/manpages.pot docs/man/po/manpages-*.po; then
            echo
            echo "::error::Manpage translation catalogs out of sync with English masters."
            echo "Run scripts/update-manpages-po.sh locally and commit the result."
            exit 1
          fi

  webapi-dictionaries:
    name: amuleapi Web UI dictionaries
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      # Checks every locale key exists in en.json with matching
      # {placeholders} (plural forms may drop {n}; missing keys fall back to
      # English), that en.json keys suit Weblate's i18next format, that locale
      # codes are canonical BCP 47 (as Intl needs), and that every preferences
      # field resolves to a real label. The label keys are derived from the
      # field names, so a renamed field with no dictionary entry would silently
      # render the raw key.
      - name: Checking Web UI dictionaries
        run: node src/webapi/tools/check-i18n.mjs
