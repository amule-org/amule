name: C/C++ CI

on:
  push:
    branches: [ "**" ]
    paths:
      - 'src/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'unittests/**'
      - 'po/**'
      - 'config.h.cm'
      - '.github/workflows/ccpp.yml'
  pull_request:
    branches: [ "**" ]
    paths:
      - 'src/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'unittests/**'
      - 'po/**'
      - 'config.h.cm'
      - '.github/workflows/ccpp.yml'

permissions:
  contents: read
  # cache-save-newest lists the repository's caches and deletes the generations
  # its save replaces.
  actions: write
  pull-requests: write

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 500M

  # The minus sign removes the trailing new line in the last line
  #
  # libayatana-appindicator3-dev is not needed to build aMule, but its
  # presence is what flips WITH_LIBAYATANA_APPINDICATOR on (CMakeLists.txt
  # probes for it with pkg_check_modules). Without it the SNI tray backend
  # in MuleTrayIcon.cpp is #ifdef'd out and never compiled here -- only
  # packaging.yml built it, and that runs after merge, so a break in that
  # half landed on master before anything noticed.
  cmake_ubuntu_deps: |-
    binutils-dev \
    build-essential \
    ccache \
    cmake \
    gettext \
    libayatana-appindicator3-dev \
    libboost-all-dev \
    libcrypto++-dev \
    libgd-dev \
    libglib2.0-dev \
    libmaxminddb-dev \
    libreadline-dev \
    libupnp-dev \
    libwxgtk3.2-dev \
    pkg-config \
    wx3.2-headers

  cmake_macos_deps: |-
    boost \
    ccache \
    cryptopp \
    gd \
    gettext \
    libmaxminddb \
    libupnp \
    pkg-config \
    wxwidgets

  # CLANG64, not MINGW64: wxWidgets 3.3 is not packaged for the latter, and
  # 3.3 is what the system light/dark appearance support needs. This also
  # matches the CLANGARM64 leg the release packaging uses, so CI and the
  # shipped Windows builds share one toolchain.
  cmake_mingw_w64_deps: |
    mingw-w64-clang-x86_64-boost
    mingw-w64-clang-x86_64-ccache
    mingw-w64-clang-x86_64-cmake
    mingw-w64-clang-x86_64-crypto++
    mingw-w64-clang-x86_64-gettext
    mingw-w64-clang-x86_64-libgd
    mingw-w64-clang-x86_64-libmaxminddb
    mingw-w64-clang-x86_64-ninja
    mingw-w64-clang-x86_64-pkgconf
    mingw-w64-clang-x86_64-readline
    mingw-w64-clang-x86_64-toolchain
    mingw-w64-clang-x86_64-wxwidgets3.3-msw
    mingw-w64-clang-x86_64-zlib

  cmake_common_config_flags: |-
    -B build \
    -DBUILD_ALC=YES \
    -DBUILD_ALCC=YES \
    -DBUILD_AMULECMD=YES \
    -DBUILD_AMULEAPI=YES \
    -DBUILD_CAS=YES \
    -DBUILD_DAEMON=YES \
    -DBUILD_WXCAS=YES \
    -DBUILD_ED2K=YES \
    -DBUILD_MONOLITHIC=YES \
    -DBUILD_REMOTEGUI=YES \
    -DBUILD_TESTING=YES \
    -DBUILD_WEBSERVER=YES \
    -DENABLE_NLS=YES \
    -DENABLE_UPNP=YES

  cmake_ubuntu_config_flags: |-
    -DENABLE_IP2COUNTRY=YES

  # ENABLE_NLS will be auto-disabled by cmake/nls.cmake: argz.h is
  #   a glibc-only header and isn't provided by macOS or Homebrew
  cmake_macos_config_flags: |-
    -DENABLE_IP2COUNTRY=YES

  cmake_mingw_w64_config_flags: |-
    -G Ninja \
    -DENABLE_IP2COUNTRY=YES

  ctest_flags: |-
    --test-dir build \
    --output-on-failure
  # CredentialsTest and AmuleApiConfigTest run the production 210,000-iteration PBKDF2 on
  # every password set and check, 5-7 s on the macOS runners, so they get 60 s where every
  # other test gets 10 s. The budget lives here rather than in a TIMEOUT property, which
  # would also cap distro builds that run ctest with no limit.
  ctest_kdf_tests: '^(CredentialsTest|AmuleApiConfigTest)$'

jobs:
  build_cmake_ubuntu:
    name: Build CMake Ubuntu (${{ matrix.build_type }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v7
      - name: restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ matrix.build_type }}-ccache-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
          restore-keys: ${{ runner.os }}-${{ matrix.build_type }}-ccache-
      - name: install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.cmake_ubuntu_deps }}
      # It seems to run faster without this, but we have to manually list the
      # dependencies abobe.
      #  run: |
      #    sudo apt-get install devscripts equivs && sudo mk-build-deps -i
      - name: create build system
        run: |
          cmake \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            ${{ env.cmake_common_config_flags }} \
            ${{ env.cmake_ubuntu_config_flags }}
      - name: zero ccache stats
        run: ccache --zero-stats
      - name: make
        run: cmake --build build
      - name: save ccache
        uses: ./.github/actions/cache-save-newest
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ matrix.build_type }}-ccache-${{ github.run_id }}
      - name: ccache stats
        if: always()
        run: ccache --show-stats
      - name: run tests
        run: |
          ctest ${{ env.ctest_flags }} --timeout 10 -E '${{ env.ctest_kdf_tests }}' &&
          ctest ${{ env.ctest_flags }} --timeout 60 -R '${{ env.ctest_kdf_tests }}'
      # amuleapi_curl_smoke drives these two against a live daemon rather than
      # compiling its own copy. Release only: the smoke times SSE windows, and
      # a Debug daemon makes those flaky.
      #
      # A tar rather than the two paths directly, because the artifact upload
      # drops the executable bit (packaging.yml chmods every mach-o back after
      # its download for the same reason) and because it pins the layout
      # run-all.sh discovers binaries through.
      - name: pack amuled + amuleapi for the curl smoke
        if: matrix.build_type == 'Release'
        run: tar -cf curl-smoke-binaries.tar build/src/amuled build/src/webapi/amuleapi
      - uses: actions/upload-artifact@v7
        if: matrix.build_type == 'Release'
        with:
          name: curl-smoke-binaries
          path: curl-smoke-binaries.tar
          if-no-files-found: error
          retention-days: 1

  # The gate-off build is what every other job already covers, because every
  # experimental switch defaults to OFF. This job is the other half: one Linux
  # build per switch with it ON, so the code behind it cannot rot unnoticed.
  #
  # One job for the whole set rather than one per switch. It asks for the set
  # through ENABLE_ALL_EXPERIMENTAL, so CI cost stays flat as switches are
  # added and no entry here has to be edited: NAT traversal, uTP, QUIC and
  # IPv6 are all still to come. Enabling everything at once is also what a
  # user who wants the features actually builds, and it is the only
  # combination that catches switches which do not compile together.
  #
  # The cost of not building each switch alone: one that compiles only
  # alongside another would pass here and fail for someone enabling just that
  # one. Accepted deliberately, since these switches are independent
  # subsystems; a per-switch entry can be added to the matrix if that changes.
  #
  # Deliberately not an extra dimension on the OS jobs -- doubling every one of
  # those would cost far more than it tells us, since these switches change no
  # platform-dependent code.
  build_cmake_ubuntu_experimental:
    name: Build CMake Ubuntu Experimental (${{ matrix.build_type }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v7
      - name: restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-experimental-${{ matrix.build_type }}-ccache-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
          restore-keys: ${{ runner.os }}-experimental-${{ matrix.build_type }}-ccache-
      - name: install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.cmake_ubuntu_deps }}
      - name: create build system
        run: |
          cmake \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            ${{ env.cmake_common_config_flags }} \
            ${{ env.cmake_ubuntu_config_flags }} \
            -DENABLE_ALL_EXPERIMENTAL=YES
      - name: zero ccache stats
        run: ccache --zero-stats
      - name: make
        run: cmake --build build
      - name: save ccache
        uses: ./.github/actions/cache-save-newest
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-experimental-${{ matrix.build_type }}-ccache-${{ github.run_id }}
      - name: ccache stats
        if: always()
        run: ccache --show-stats
      - name: run tests
        run: |
          ctest ${{ env.ctest_flags }} --timeout 10 -E '${{ env.ctest_kdf_tests }}' &&
          ctest ${{ env.ctest_flags }} --timeout 60 -R '${{ env.ctest_kdf_tests }}'

  # The amuleapi curl-smoke matrix, which nothing else in CI runs. Every other
  # job here compiles the REST surface; none of them exercises it. This one
  # drives the whole chain in one piece -- amuled, EC, amuleapi, HTTP -- which
  # is the only way a break in the wiring between those shows up before a user
  # or an operator running the suite by hand finds it.
  amuleapi_curl_smoke:
    name: amuleapi curl smoke (Ubuntu)
    runs-on: ubuntu-24.04
    # Reuses the Release leg's amuled and amuleapi instead of compiling a
    # fifth Ubuntu tree. `needs` also means a build or ctest failure skips
    # this job rather than reporting a second, derived failure.
    needs: build_cmake_ubuntu
    # A fork only ever fast-forwards its master from here, so a push to it
    # re-tests a commit that already passed and mails the fork owner about a
    # failure they did not cause. Their own branches and their PRs still run.
    if: github.repository == 'amule-org/amule' || github.ref != 'refs/heads/master'
    # This job starts daemons and waits on sockets; a hung one should cost
    # minutes, not hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: curl-smoke-binaries
      - name: unpack amuled + amuleapi
        run: tar -xf curl-smoke-binaries.tar
      # Nothing is compiled here, but the binaries still need their shared
      # libraries. Installing the same -dev list is what keeps those matched
      # to the build job; naming runtime sonames instead would drift the
      # moment that list changes.
      - name: install runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.cmake_ubuntu_deps }} jq
      # Every peer-to-peer switch is off, so the daemon joins no ed2k server,
      # bootstraps no Kad and opens no UPnP mapping. It still makes the two
      # ordinary startup fetches over HTTPS -- the release check and the GeoIP
      # database -- because 01-version-and-errors.sh and 32-country-flags.sh
      # are the tests for those. 38-chat.sh addresses its peer at 203.0.113.42
      # (RFC 5737 TEST-NET-3), which is unroutable by design, so the chat it
      # creates never leaves the runner either.
      - name: start an isolated amuled
        run: |
          set -euo pipefail
          CONF="$RUNNER_TEMP/amuled-conf"
          mkdir -p "$CONF/Incoming" "$CONF/Temp"
          # amuled stores the EC password as its md5. Derive it from the
          # plaintext run-all.sh expects so the two cannot drift apart.
          EC_HASH=$(printf '%s' amule | md5sum | cut -d' ' -f1)
          cat > "$CONF/amule.conf" <<EOF
          [eMule]
          Port=14662
          UDPPort=14672
          UDPEnable=0
          Autoconnect=0
          ConnectToED2K=0
          ConnectToKad=0
          Reconnect=0
          UPnPEnabled=0
          IncomingDir=$CONF/Incoming
          TempDir=$CONF/Temp
          [ExternalConnect]
          AcceptExternalConnections=1
          ECAddress=127.0.0.1
          ECPort=4712
          ECPassword=$EC_HASH
          [WebServer]
          Enabled=0
          EOF
          nohup build/src/amuled -c "$CONF" > "$CONF/stdout.log" 2>&1 &
          # Wait for the EC listener instead of sleeping: cold start is a
          # second or two here, and a fixed sleep either wastes it or races it.
          ready=
          for _ in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/4712) 2>/dev/null; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [ -z "$ready" ]; then
            echo "::error::amuled never opened its EC port"
            cat "$CONF/stdout.log"
            exit 1
          fi
      - name: run the amuleapi curl smoke
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/curl-smoke.log"
          cd unittests/curl-tests/amuleapi
          # Named the other way round on purpose: the job runs every phase on
          # disk except these, so a phase added later is covered without
          # anyone remembering to list it here. If it needs something this
          # daemon has not got, it fails loudly and gets a line below with the
          # reason, which is the direction of failure we want.
          #
          # 07, 10, 19, 20, 22 and 28 need a real ed2k search to come back
          # with hits; 14, 16 and 26 need a live ed2k or Kad connection; 24
          # needs enough event churn to be handed a cursor, which a daemon
          # with no peers never produces, so it sees resync(gap) where it
          # asserts resync(idle). Running any of them would mean putting a CI
          # runner on the ed2k network. 00 and 99 bracket the full suite with
          # a peer fixture built from a real search hit, so they go too.
          EXCLUDED=(
            00-peer-fixture.sh
            07-read-stats-and-search-results.sh
            10-refresher-lazy-ondemand.sh
            14-servers-mutations.sh
            16-networks-connect.sh
            19-search.sh
            20-etag-conditional-get.sh
            22-sse-diff-emission.sh
            24-sse-resync.sh
            26-rfc-followup-endpoints.sh
            28-list-pagination-sort.sh
            99-peer-fixture-teardown.sh
          )
          # An excluded phase that no longer exists means the list has gone
          # stale against the suite, and would quietly shrink what runs.
          for e in "${EXCLUDED[@]}"; do
            if [ ! -f "$e" ]; then
              echo "::error::excluded phase $e no longer exists; the list above has drifted"
              exit 1
            fi
          done
          # Numeric prefixes are zero-padded, so the glob is already in the
          # canonical order run-all.sh documents. That order is load-bearing:
          # the phases share one daemon and its state carries forward.
          PHASES=()
          for f in [0-9]*.sh; do
            skip=
            for e in "${EXCLUDED[@]}"; do
              if [ "$f" = "$e" ]; then
                skip=1
                break
              fi
            done
            if [ -z "$skip" ]; then
              PHASES+=("$f")
            fi
          done
          if [ "${#PHASES[@]}" -eq 0 ]; then
            echo "::error::no phases selected; the suite or the glob has moved"
            exit 1
          fi
          echo "running ${#PHASES[@]} phases: ${PHASES[*]}"
          set +e
          AMULEAPI_BIN="$GITHUB_WORKSPACE/build/src/webapi/amuleapi" \
          AMULE_SHARED_DIR="$RUNNER_TEMP/amuled-conf/Incoming" \
            ./run-all.sh "${PHASES[@]}" 2>&1 | tee "$LOG"
          rc=${PIPESTATUS[0]}
          set -e
          exit "$rc"
      - name: daemon logs on failure
        if: failure()
        run: |
          echo "----- amuleapi -----"
          tail -n 200 /tmp/amuleapi.log || true
          echo "----- amuled -----"
          tail -n 200 "$RUNNER_TEMP/amuled-conf/logfile" || true
      - name: stop amuled
        if: always()
        run: pkill -f "amuled -c $RUNNER_TEMP/amuled-conf" || true

  build_cmake_macos:
    name: Build CMake MacOS (${{ matrix.build_type }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v7
      - name: restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ matrix.build_type }}-ccache-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
          restore-keys: ${{ runner.os }}-${{ matrix.build_type }}-ccache-
      - name: install deps
        run: |
          brew update
          brew install ${{ env.cmake_macos_deps }}
          # Homebrew installs into /opt/homebrew on Apple Silicon — not a
          # default compiler/linker/pkg-config search path. aMule's custom
          # cmake/cryptopp.cmake uses check_include_file_cxx which does NOT
          # honour CMAKE_PREFIX_PATH, so export CPATH/LIBRARY_PATH directly.
          BREW_PREFIX=$(brew --prefix)
          echo "CPATH=$BREW_PREFIX/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$BREW_PREFIX/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$BREW_PREFIX/lib/pkgconfig:$(brew --prefix gd)/lib/pkgconfig:$(brew --prefix libupnp)/lib/pkgconfig:$(brew --prefix gettext)/lib/pkgconfig" >> "$GITHUB_ENV"
          # gettext is keg-only on macOS; add msgfmt to PATH for NLS probe
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"
      - name: create build system
        run: |
          cmake \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            ${{ env.cmake_common_config_flags }} \
            ${{ env.cmake_macos_config_flags }}
      - name: zero ccache stats
        run: ccache --zero-stats
      - name: make
        run: cmake --build build
      - name: save ccache
        uses: ./.github/actions/cache-save-newest
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ matrix.build_type }}-ccache-${{ github.run_id }}
      - name: ccache stats
        if: always()
        run: ccache --show-stats
      - name: run tests
        run: |
          ctest ${{ env.ctest_flags }} --timeout 10 -E '${{ env.ctest_kdf_tests }}' &&
          ctest ${{ env.ctest_flags }} --timeout 60 -R '${{ env.ctest_kdf_tests }}'

  build_cmake_windows_mingw_w64:
    name: Build CMake mingw-w64 (${{ matrix.build_type }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        # ENABLE_UTP on one leg only. The vendored libutp compiles
        # libutp_inet_ntop.cpp under if(WIN32), and both jobs that set
        # ENABLE_ALL_EXPERIMENTAL run on ubuntu-latest, so that source was
        # built by nothing: a pin bump or an MSYS2 toolchain shift would break
        # Windows silently and be found by whoever first turned the switch on
        # there. One leg is enough to compile it, and keeps the cost of a
        # snapshot that does not build on Windows to a single job.
        include:
          - build_type: Debug
            extra_config_flags: -DENABLE_UTP=YES
          - build_type: Release
            extra_config_flags: ""
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - name: restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ matrix.build_type }}-ccache-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
          restore-keys: ${{ runner.os }}-${{ matrix.build_type }}-ccache-
      - name: set up MSYS2 mingw-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: ${{ env.cmake_mingw_w64_deps }}
      # MSYS2 only packages pupnp 1.14.x; build the pinned 22.x from source so
      # Windows gets the UPnP fixes released in 22.0.4 (issue #242). Installed
      # into $MINGW_PREFIX so find_package(UPNP CONFIG) picks it up and the DLL
      # bundles into the portable.
      - name: build libupnp (pupnp) from source
        run: |
          set -euo pipefail
          . packaging/linux/versions.env
          curl -L -o /tmp/libupnp.tar.gz "$LIBUPNP_TARBALL_URL"
          echo "$LIBUPNP_SHA256  /tmp/libupnp.tar.gz" | sha256sum -c -
          mkdir -p /tmp/libupnp
          tar -xf /tmp/libupnp.tar.gz -C /tmp/libupnp --strip-components=1
          cmake -S /tmp/libupnp -B /tmp/libupnp/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DUPNP_BUILD_SHARED=ON -DUPNP_BUILD_STATIC=OFF \
            -DUPNP_BUILD_SAMPLES=OFF -DUPNP_BUILD_TESTS=OFF -Dreuseaddr=ON -Dipv6=ON \
            -DCMAKE_INSTALL_PREFIX="$MINGW_PREFIX"
          cmake --build /tmp/libupnp/build
          cmake --install /tmp/libupnp/build
      - name: create build system
        run: |
          cmake \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            ${{ env.cmake_common_config_flags }} \
            ${{ env.cmake_mingw_w64_config_flags }} \
            ${{ matrix.extra_config_flags }}
      - name: zero ccache stats
        run: ccache --zero-stats
      - name: make
        run: cmake --build build
      - name: save ccache
        uses: ./.github/actions/cache-save-newest
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ matrix.build_type }}-ccache-${{ github.run_id }}
      - name: ccache stats
        if: always()
        run: ccache --show-stats
      - name: run tests
        run: |
          ctest ${{ env.ctest_flags }} --timeout 10 -E '${{ env.ctest_kdf_tests }}' &&
          ctest ${{ env.ctest_flags }} --timeout 60 -R '${{ env.ctest_kdf_tests }}'
