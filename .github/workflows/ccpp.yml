name: C/C++ CI

on:
  push:
    branches: [ "**" ]
    paths:
      - 'src/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'unittests/**'
      - 'po/**'
      - 'config.h.cm'
      - '.github/workflows/ccpp.yml'
  pull_request:
    branches: [ "**" ]
    paths:
      - 'src/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'unittests/**'
      - 'po/**'
      - 'config.h.cm'
      - '.github/workflows/ccpp.yml'

permissions:
  contents: read
  pull-requests: write

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 500M

  # The minus sign removes the trailing new line in the last line
  #
  # libayatana-appindicator3-dev is not needed to build aMule, but its
  # presence is what flips WITH_LIBAYATANA_APPINDICATOR on (CMakeLists.txt
  # probes for it with pkg_check_modules). Without it the SNI tray backend
  # in MuleTrayIcon.cpp is #ifdef'd out and never compiled here -- only
  # packaging.yml built it, and that runs after merge, so a break in that
  # half landed on master before anything noticed.
  cmake_ubuntu_deps: |-
    binutils-dev \
    build-essential \
    ccache \
    cmake \
    gettext \
    libayatana-appindicator3-dev \
    libboost-all-dev \
    libcrypto++-dev \
    libgd-dev \
    libglib2.0-dev \
    libmaxminddb-dev \
    libreadline-dev \
    libupnp-dev \
    libwxgtk3.2-dev \
    pkg-config \
    wx3.2-headers

  cmake_macos_deps: |-
    boost \
    ccache \
    cryptopp \
    gd \
    gettext \
    libmaxminddb \
    libupnp \
    pkg-config \
    wxwidgets

  # CLANG64, not MINGW64: wxWidgets 3.3 is not packaged for the latter, and
  # 3.3 is what the system light/dark appearance support needs. This also
  # matches the CLANGARM64 leg the release packaging uses, so CI and the
  # shipped Windows builds share one toolchain.
  cmake_mingw_w64_deps: |
    mingw-w64-clang-x86_64-boost
    mingw-w64-clang-x86_64-ccache
    mingw-w64-clang-x86_64-cmake
    mingw-w64-clang-x86_64-crypto++
    mingw-w64-clang-x86_64-gettext
    mingw-w64-clang-x86_64-libgd
    mingw-w64-clang-x86_64-libmaxminddb
    mingw-w64-clang-x86_64-ninja
    mingw-w64-clang-x86_64-pkgconf
    mingw-w64-clang-x86_64-readline
    mingw-w64-clang-x86_64-toolchain
    mingw-w64-clang-x86_64-wxwidgets3.3-msw
    mingw-w64-clang-x86_64-zlib

  cmake_common_config_flags: |-
    -B build \
    -DBUILD_ALC=YES \
    -DBUILD_ALCC=YES \
    -DBUILD_AMULECMD=YES \
    -DBUILD_AMULEAPI=YES \
    -DBUILD_CAS=YES \
    -DBUILD_DAEMON=YES \
    -DBUILD_WXCAS=YES \
    -DBUILD_ED2K=YES \
    -DBUILD_MONOLITHIC=YES \
    -DBUILD_REMOTEGUI=YES \
    -DBUILD_TESTING=YES \
    -DBUILD_WEBSERVER=YES \
    -DENABLE_NLS=YES \
    -DENABLE_UPNP=YES

  cmake_ubuntu_config_flags: |-
    -DENABLE_IP2COUNTRY=YES

  # ENABLE_NLS will be auto-disabled by cmake/nls.cmake: argz.h is
  #   a glibc-only header and isn't provided by macOS or Homebrew
  cmake_macos_config_flags: |-
    -DENABLE_IP2COUNTRY=YES

  cmake_mingw_w64_config_flags: |-
    -G Ninja \
    -DENABLE_IP2COUNTRY=YES

  ctest_flags: |-
    --test-dir build \
    --output-on-failure \
    --timeout 10

jobs:
  build_cmake_ubuntu:
    name: Build CMake Ubuntu (${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v7
      - name: restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ matrix.build_type }}-ccache-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
          restore-keys: ${{ runner.os }}-${{ matrix.build_type }}-ccache-
      - name: install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.cmake_ubuntu_deps }}
      # It seems to run faster without this, but we have to manually list the
      # dependencies abobe.
      #  run: |
      #    sudo apt-get install devscripts equivs && sudo mk-build-deps -i
      - name: create build system
        run: |
          cmake \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            ${{ env.cmake_common_config_flags }} \
            ${{ env.cmake_ubuntu_config_flags }}
      - name: zero ccache stats
        run: ccache --zero-stats
      - name: make
        run: cmake --build build
      - name: save ccache
        uses: actions/cache/save@v6
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ matrix.build_type }}-ccache-${{ github.run_id }}
      - name: ccache stats
        if: always()
        run: ccache --show-stats
      - name: run tests
        run: ctest ${{ env.ctest_flags }}

  # The gate-off build is what every other job already covers, because
  # ENABLE_KAD_PROTOCOL_10 defaults to OFF. This job is the other half: one
  # Linux build with the switch ON, so the code behind it cannot rot
  # unnoticed. Deliberately a separate job at a single build type rather than
  # an extra matrix dimension -- doubling every OS job would cost far more
  # than it tells us, since the switch changes no platform-dependent code.
  build_cmake_ubuntu_kad_protocol_10:
    name: Build CMake Ubuntu (Release, ENABLE_KAD_PROTOCOL_10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-kad10-ccache-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
          restore-keys: ${{ runner.os }}-kad10-ccache-
      - name: install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.cmake_ubuntu_deps }}
      - name: create build system
        run: |
          cmake \
            -DCMAKE_BUILD_TYPE=Release \
            ${{ env.cmake_common_config_flags }} \
            ${{ env.cmake_ubuntu_config_flags }} \
            -DENABLE_KAD_PROTOCOL_10=YES
      - name: zero ccache stats
        run: ccache --zero-stats
      - name: make
        run: cmake --build build
      - name: save ccache
        uses: actions/cache/save@v6
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-kad10-ccache-${{ github.run_id }}
      - name: ccache stats
        if: always()
        run: ccache --show-stats
      - name: run tests
        run: ctest ${{ env.ctest_flags }}

  build_cmake_macos:
    name: Build CMake MacOS (${{ matrix.build_type }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v7
      - name: restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ matrix.build_type }}-ccache-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
          restore-keys: ${{ runner.os }}-${{ matrix.build_type }}-ccache-
      - name: install deps
        run: |
          brew update
          brew install ${{ env.cmake_macos_deps }}
          # Homebrew installs into /opt/homebrew on Apple Silicon — not a
          # default compiler/linker/pkg-config search path. aMule's custom
          # cmake/cryptopp.cmake uses check_include_file_cxx which does NOT
          # honour CMAKE_PREFIX_PATH, so export CPATH/LIBRARY_PATH directly.
          BREW_PREFIX=$(brew --prefix)
          echo "CPATH=$BREW_PREFIX/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$BREW_PREFIX/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$BREW_PREFIX/lib/pkgconfig:$(brew --prefix gd)/lib/pkgconfig:$(brew --prefix libupnp)/lib/pkgconfig:$(brew --prefix gettext)/lib/pkgconfig" >> "$GITHUB_ENV"
          # gettext is keg-only on macOS; add msgfmt to PATH for NLS probe
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"
      - name: create build system
        run: |
          cmake \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            ${{ env.cmake_common_config_flags }} \
            ${{ env.cmake_macos_config_flags }}
      - name: zero ccache stats
        run: ccache --zero-stats
      - name: make
        run: cmake --build build
      - name: save ccache
        uses: actions/cache/save@v6
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ matrix.build_type }}-ccache-${{ github.run_id }}
      - name: ccache stats
        if: always()
        run: ccache --show-stats
      - name: run tests
        run: ctest ${{ env.ctest_flags }}

  build_cmake_windows_mingw_w64:
    name: Build CMake mingw-w64 (${{ matrix.build_type }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - name: restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ matrix.build_type }}-ccache-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
          restore-keys: ${{ runner.os }}-${{ matrix.build_type }}-ccache-
      - name: set up MSYS2 mingw-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: ${{ env.cmake_mingw_w64_deps }}
      # MSYS2 only packages pupnp 1.14.x; build the pinned 22.x from source so
      # Windows gets the UPnP fixes released in 22.0.4 (issue #242). Installed
      # into $MINGW_PREFIX so find_package(UPNP CONFIG) picks it up and the DLL
      # bundles into the portable.
      - name: build libupnp (pupnp) from source
        run: |
          set -euo pipefail
          . packaging/linux/versions.env
          curl -L -o /tmp/libupnp.tar.gz "$LIBUPNP_TARBALL_URL"
          echo "$LIBUPNP_SHA256  /tmp/libupnp.tar.gz" | sha256sum -c -
          mkdir -p /tmp/libupnp
          tar -xf /tmp/libupnp.tar.gz -C /tmp/libupnp --strip-components=1
          cmake -S /tmp/libupnp -B /tmp/libupnp/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DUPNP_BUILD_SHARED=ON -DUPNP_BUILD_STATIC=OFF \
            -DUPNP_BUILD_SAMPLES=OFF -DUPNP_BUILD_TESTS=OFF -Dreuseaddr=ON -Dipv6=ON \
            -DCMAKE_INSTALL_PREFIX="$MINGW_PREFIX"
          cmake --build /tmp/libupnp/build
          cmake --install /tmp/libupnp/build
      - name: create build system
        run: |
          cmake \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            ${{ env.cmake_common_config_flags }} \
            ${{ env.cmake_mingw_w64_config_flags }}
      - name: zero ccache stats
        run: ccache --zero-stats
      - name: make
        run: cmake --build build
      - name: save ccache
        uses: actions/cache/save@v6
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ matrix.build_type }}-ccache-${{ github.run_id }}
      - name: ccache stats
        if: always()
        run: ccache --show-stats
      - name: run tests
        run: ctest ${{ env.ctest_flags }}
