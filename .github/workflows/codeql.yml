# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL Advanced"

on:
  push:
    branches: [ "master" ]
    # Everything the three analyses read: C/C++ sources and their build, Python
    # scripts and tests, and the workflows. Docs and translations skip it.
    paths:
      - 'src/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'config.h.cm'
      - 'unittests/**'
      - 'scripts/**'
      - 'packaging/**'
      - '.github/**'
  # pull_request trigger intentionally omitted: a merged PR is just a push to
  # master, so the push trigger above already covers it.
  # Note: without a pull_request trigger, GitHub will not post a "Code scanning"
  # status check on open PRs. If branch protection rules require that check,
  # re-add the pull_request trigger.
  schedule:
    - cron: "30 21 * * 4"

# Each run analyzes the whole codebase, and code scanning keeps only the latest
# master results, so a newer push makes the running analysis pointless. TRAP
# caching is off, so a cancelled run loses no cache.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  # The minus sign removes the trailing new line in the last line
  # libayatana-appindicator3-dev: without it the SNI tray backend in
  # MuleTrayIcon.cpp is #ifdef'd out and is never analysed.
  # Only Boost headers are used; avoid unused MPI and GPU runtime downloads.
  cmake_ubuntu_deps: |-
    binutils-dev \
    build-essential \
    cmake \
    gettext \
    libayatana-appindicator3-dev \
    libboost-dev \
    libcrypto++-dev \
    libgd-dev \
    libglib2.0-dev \
    libmediainfo-dev libmaxminddb-dev \
    libreadline-dev \
    libupnp-dev \
    libwxgtk3.2-dev \
    pkg-config \
    wx3.2-headers

  cmake_common_config_flags: |-
    -B build \
    -DCMAKE_BUILD_TYPE=Debug \
    -DBUILD_ALC=YES \
    -DBUILD_ALCC=YES \
    -DBUILD_AMULECMD=YES \
    -DBUILD_CAS=YES \
    -DBUILD_DAEMON=YES \
    -DBUILD_WXCAS=YES \
    -DBUILD_ED2K=YES \
    -DBUILD_MONOLITHIC=YES \
    -DBUILD_REMOTEGUI=YES \
    -DBUILD_TESTING=YES \
    -DBUILD_WEBSERVER=YES \
    -DENABLE_NLS=YES \
    -DENABLE_UPNP=YES

  cmake_ubuntu_config_flags: |-
    -DENABLE_IP2COUNTRY=YES

jobs:
  # A master push analyzes only the languages whose files it changed: C/C++ takes
  # about 80 minutes, so a workflow-only change runs just the actions analysis.
  # Scheduled runs, a change to this workflow, and pushes whose changed files
  # cannot be listed analyze all three.
  languages:
    name: Select languages
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Select languages
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          all=true
          if [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            # The compare API lists at most 300 files; a longer list analyzes everything.
            if files=$(gh api "repos/$REPO/compare/$BEFORE...$SHA" \
                --jq 'if (.files | length) < 300 then .files[].filename else error("too many") end'); then
              all=false
            fi
          fi
          has() { [ "$all" = true ] || grep -q -E "$1" <<<"$files"; }
          config='^\.github/workflows/codeql\.yml$'
          entries=()
          has '^\.github/' && entries+=('{"language":"actions","build-mode":"none"}')
          has "^(src/|cmake/|CMakeLists\.txt\$|config\.h\.cm\$|unittests/|\.github/actions/apt-install/)|$config" &&
            entries+=('{"language":"c-cpp","build-mode":"manual"}')
          has "\.py\$|$config" && entries+=('{"language":"python","build-mode":"none"}')
          matrix="{\"include\":[$(IFS=,; echo "${entries[*]}")]}"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Languages: $matrix"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: languages
    if: needs.languages.outputs.matrix != '{"include":[]}'
    # Runner size impacts CodeQL analysis time. To learn more, please see:
    #   - https://gh.io/recommended-hardware-resources-for-running-codeql
    #   - https://gh.io/supported-runners-and-hardware-resources
    #   - https://gh.io/using-larger-runners (GitHub.com only)
    # Consider using larger runners or machines with greater resources for possible analysis time improvements.
    runs-on: ${{ (matrix.language == 'swift' && 'macos-26') || 'ubuntu-24.04' }}
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      # java-kotlin was dropped: the tree's last Java file, the generated
      # ECCodes.java, went with the committed EC headers, so the analysis
      # had nothing left to scan and failed on every run.
      matrix: ${{ fromJSON(needs.languages.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Add any setup steps before running the `github/codeql-action/init` action.
      # This includes steps like installing compilers or runtimes (`actions/setup-node`
      # or others). This is typically only required for manual builds.
      # - name: Setup runtime (example)
      #   uses: actions/setup-example@v1

      # Before init, so the CodeQL tracer does not watch apt.
      - name: install deps
        if: matrix.build-mode == 'manual'
        uses: ./.github/actions/apt-install
        with:
          packages: ${{ env.cmake_ubuntu_deps }}

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # A cache from the same sources did not make the C++ extraction
          # faster, and it took 1-3 GB of the Actions cache.
          trap-caching: false
          # If you wish to specify custom queries, you can do so here or in a config file.
          # By default, queries listed here will override any specified in a config file.
          # Prefix the list here with "+" to use these queries and those in the config file.

          # For more details on CodeQL's query packs, refer to: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
          # queries: security-extended,security-and-quality

          # If the analyze step fails for one of the languages you are analyzing with
          # "We were unable to automatically build your code", modify the matrix above
          # to set the build mode to "manual" for that language. Then modify this step
          # to build your code.
          # ℹ️ Command-line programs to run using the OS shell.
          # 📚 See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsrun
      - name: Run manual build steps
        if: matrix.build-mode == 'manual'
        shell: bash
        run: |
          # echo 'If you are using a "manual" build mode for one or more of the' \
          #   'languages you are analyzing, replace this with the commands to build' \
          #   'your code, for example:'
          # echo '  make bootstrap'
          # echo '  make release'
          # exit 1

          cmake \
            ${{ env.cmake_common_config_flags }} \
            ${{ env.cmake_ubuntu_config_flags }}
          cmake --build build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
