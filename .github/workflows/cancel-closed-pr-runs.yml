# Cancels a PR's queued and running workflow runs once it is merged or closed.
# Its concurrency group cancels them only on a newer push to the PR, and the
# master push run already tests the merged code.
#
# pull_request_target, because a fork PR's pull_request token cannot cancel
# runs. It never checks out the PR's code.
name: Cancel closed PR runs

on:
  pull_request_target:
    types: [closed]

permissions:
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-slim
    steps:
      - name: Cancel the PR's unfinished runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api --paginate "repos/${REPO}/actions/runs?event=pull_request&head_sha=${SHA}&per_page=100" \
              --jq '.workflow_runs[] | select(.status != "completed") | "\(.id) \(.name)"' |
          while read -r id name; do
              if gh api -X POST "repos/${REPO}/actions/runs/${id}/cancel" >/dev/null; then
                  echo "cancelled ${id} (${name})"
              else
                  echo "could not cancel ${id} (${name})"
              fi
          done
