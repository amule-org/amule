name: Media parser compatibility
on:
  workflow_dispatch:
  pull_request:
    paths: ['src/mediaprobe/**', 'packaging/media/**', 'packaging/linux/versions.env', '.github/workflows/media-probe.yml']
permissions:
  contents: read
jobs:
  system:
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:12', 'ubuntu:22.04', 'ubuntu:24.04']
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      - run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y git cmake ninja-build g++ pkg-config python3 libavformat-dev libavcodec-dev libavutil-dev ffmpeg strace
      - uses: actions/checkout@v7
      - run: cmake -S src/mediaprobe -B build-media -G Ninja -DBUILD_TESTING=ON -DMEDIA_PROBE_REQUIRE_FIXTURES=ON
      - run: cmake --build build-media -j3
      - run: AMULE_REQUIRE_STRACE=1 ctest --test-dir build-media --output-on-failure
  bundled:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config zlib1g-dev ffmpeg strace
      - if: runner.os == 'macOS'
        run: brew install ninja pkg-config ffmpeg
      - run: python3 packaging/media/build-ffmpeg.py "$PWD/media-prefix" "$PWD/media-sources"
      - run: PKG_CONFIG_PATH="$PWD/media-prefix/lib/pkgconfig" cmake -S src/mediaprobe -B build-media -G Ninja -DCMAKE_BUILD_TYPE=MinSizeRel -DMEDIA_PROBE_STATIC=ON -DCMAKE_PREFIX_PATH="$PWD/media-prefix" -DBUILD_TESTING=ON -DMEDIA_PROBE_REQUIRE_FIXTURES=ON
      - run: cmake --build build-media -j3 && ctest --test-dir build-media --output-on-failure
      - uses: actions/upload-artifact@v7
        with:
          name: media-${{ runner.os }}-${{ runner.arch }}
          path: |
            build-media/src/amule-media-probe
            media-prefix/share/licenses/amule-media-probe/
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            msystem: CLANG64
            prefix: mingw-w64-clang-x86_64
          - os: windows-11-arm
            msystem: CLANGARM64
            prefix: mingw-w64-clang-aarch64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          # ARM runner images can lack paccache; cache cleanup must not block tests.
          cache: false
          update: true
          install: >-
            make
            ${{ matrix.prefix }}-toolchain
            ${{ matrix.prefix }}-cmake
            ${{ matrix.prefix }}-ninja
            ${{ matrix.prefix }}-pkgconf
            ${{ matrix.prefix }}-python
            ${{ matrix.prefix }}-zlib
            ${{ matrix.prefix }}-ffmpeg
      - run: python packaging/media/build-ffmpeg.py "$PWD/media-prefix" "$PWD/media-sources"
      - run: PKG_CONFIG_PATH="$PWD/media-prefix/lib/pkgconfig" cmake -S src/mediaprobe -B build-media -G Ninja -DCMAKE_BUILD_TYPE=MinSizeRel -DMEDIA_PROBE_STATIC=ON -DCMAKE_PREFIX_PATH="$PWD/media-prefix" -DBUILD_TESTING=ON -DMEDIA_PROBE_REQUIRE_FIXTURES=ON
      - run: cmake --build build-media -j3 && ctest --test-dir build-media --output-on-failure
      - uses: actions/upload-artifact@v7
        with:
          name: media-Windows-${{ runner.arch }}
          path: |
            build-media/src/amule-media-probe.exe
            media-prefix/share/licenses/amule-media-probe/
