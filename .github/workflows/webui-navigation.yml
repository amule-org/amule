name: WebUI navigation

on:
  push:
    branches: [ "**" ]
    paths:
      - 'src/webapi/static/**'
      - 'unittests/browser-tests/remember-tabs.cjs'
      - '.github/workflows/webui-navigation.yml'
  pull_request:
    branches: [ "**" ]
    paths:
      - 'src/webapi/static/**'
      - 'unittests/browser-tests/remember-tabs.cjs'
      - '.github/workflows/webui-navigation.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  remember-tabs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/amule-navigation-browser" --no-package-lock playwright@1.62.1
          "$RUNNER_TEMP/amule-navigation-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check tab selections through the WebUI router
        env:
          NODE_PATH: ${{ runner.temp }}/amule-navigation-browser/node_modules
        run: node unittests/browser-tests/remember-tabs.cjs
