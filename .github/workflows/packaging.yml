# Packaging CI — verifies the recipes in packaging/{linux,macos,windows}/
# still produce working artifacts on every push to a branch that includes
# packaging/ changes. NOT tag-triggered (that's release.yml later); this
# is the per-PR sanity gate.
#
# Each platform builds on its native GHA runner (no QEMU emulation).
# macOS Universal2 is the special case — built by parallel arm64 + x86_64
# jobs and merged in a follow-up `lipo` job, since standard Homebrew on
# Apple Silicon ships native-arch-only dylibs.
#
# Artifacts uploaded per matrix entry; not assembled into a Release here.

name: Packaging

on:
  # Auto-fires only on push to master — i.e. when a PR is merged. Open
  # PRs do NOT trigger this workflow; reviewers who want to inspect a
  # PR's artifacts before merging can run `workflow_dispatch` against
  # the PR branch from the Actions UI. This avoids the double-fire of
  # "fires on PR open AND on merge" which is the most expensive shape.
  # Path filter ensures doc-only commits don't burn CI either.
  push:
    branches:
      - master
      - 'packaging**'
    paths:
      - 'packaging/**'
      - '.github/workflows/packaging.yml'
      - 'src/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
  workflow_dispatch:
    inputs:
      only:
        description: >-
          Comma-separated list of platform tracks to run.
          Default empty = run all. Useful during iteration to focus
          on the failing tracks without paying for the green ones.
          Valid: appimage, flatpak, macos, windows, linux-static.
        required: false
        type: string
        default: ''
  # Lets release.yml invoke this matrix as a reusable workflow on tag
  # pushes — same artifact set, no duplication of the build steps.
  workflow_call:
    inputs:
      only:
        required: false
        type: string
        default: ''

permissions:
  contents: read
  # cache-save-newest lists the repository's caches and deletes the generations
  # its save replaces.
  actions: write

# ccache wiring. Every compile job (appimage / flatpak / macos / windows-
# zip) installs ccache and persists its cache across runs via
# actions/cache. CMakeLists.txt auto-detects ccache and wraps cmake's
# CMAKE_<LANG>_COMPILER_LAUNCHER; with the cache warm, the second build
# of the same arch on the same branch skips most of the compile step.
#
# Skipped on workflow_call (release.yml tag builds) so the release
# artifact set is always produced from a cold compile -- belt-and-
# suspenders against any "could ccache be lying to me" worry on a binary
# that's about to ship. PR / branch / dispatch runs use the cache.
env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 1G

# Runner versions here are compatibility decisions, not drift, and each job's is
# different on purpose. Do not harmonise them:
#
#   appimage      ubuntu-22.04  an AppImage links the host glibc, so this runner sets
#                               the OLDEST system the artifact runs on. Bumping it
#                               raises that floor and strands users.
#   linux-static  ubuntu-22.04  builds inside Alpine, host barely matters.
#   flatpak       ubuntu-24.04  needs appstream 1.0+ for appstream-compose, absent on 22.04.
#   macos-build   macos-15      the SDK the shipped .app is built against, and the
#                               Intel leg needs Rosetta on the runner.
#   windows       windows-2025 / windows-11-arm
#
# release.yml's own jobs are a different matter: they ship nothing that links against
# the runner, so they all sit on one current image.

jobs:

  # ------------------------------------------------------------------
  # Linux — AppImage on x86_64 + aarch64 native runners
  # ------------------------------------------------------------------
  appimage:
    name: AppImage (${{ matrix.arch }})
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.only == '' ||
      contains(inputs.only, 'appimage')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  runs-on: ubuntu-22.04 }
          - { arch: aarch64, runs-on: ubuntu-22.04-arm }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # for git describe in build.sh
      - name: Install ccache
        if: github.event_name != 'workflow_call'
        run: sudo apt-get update && sudo apt-get install -y ccache
      - name: Restore ccache
        if: github.event_name != 'workflow_call'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-appimage-${{ matrix.arch }}-ccache-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
          restore-keys: ${{ runner.os }}-appimage-${{ matrix.arch }}-ccache-
      - name: Zero ccache stats
        if: github.event_name != 'workflow_call'
        run: ccache --zero-stats
      # buildx + a gha layer cache for the image build, matching the static
      # track. wxWidgets is compiled inside the image, so ccache never sees
      # it; without this every run rebuilds it from scratch.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build AppImage
        env:
          APPIMAGE_CACHE_SCOPE: ${{ github.event_name != 'workflow_call' && format('appimage-{0}', matrix.arch) || '' }}
        run: packaging/linux/build.sh appimage
      - name: Validate via cross-distro Docker matrix
        run: packaging/linux/build.sh validate
      - name: Save ccache
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: ./.github/actions/cache-save-newest
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-appimage-${{ matrix.arch }}-ccache-${{ github.run_id }}
      - name: ccache stats
        if: always() && github.event_name != 'workflow_call'
        run: ccache --show-stats
      - uses: actions/upload-artifact@v7
        with:
          name: appimage-${{ matrix.arch }}
          path: dist/aMule-*-Linux-*.AppImage
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Linux — fully static amuled/amulecmd/amuleapi (musl/Alpine) on
  # x86_64 + aarch64 native runners. Self-contained binaries with no
  # runtime shared-library deps, for containers / minimal / musl hosts.
  # See packaging/docker/Dockerfile.static-daemon.
  # ------------------------------------------------------------------
  linux-static:
    name: Linux static (${{ matrix.arch }})
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.only == '' ||
      contains(inputs.only, 'linux-static')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  runs-on: ubuntu-22.04 }
          - { arch: aarch64, runs-on: ubuntu-22.04-arm }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # git describe for the version string

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # STATIC_CACHE_SCOPE turns on buildx's gha layer cache (the ccache
      # analogue for this track): the dep layers (Crypto++ / wxWidgets /
      # pupnp / apk) persist across runs, so only the aMule compile re-runs
      # on a src change. Empty on workflow_call (release.yml tag builds) so
      # the shipped binaries always come from a cold compile.
      - name: Build static tarball
        env:
          STATIC_CACHE_SCOPE: ${{ github.event_name != 'workflow_call' && format('linux-static-{0}', matrix.arch) || '' }}
        run: packaging/linux/build.sh static

      - uses: actions/upload-artifact@v7
        with:
          name: linux-static-${{ matrix.arch }}
          path: dist/aMule-*-Linux-*-static.tar.gz
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Linux — Flatpak on x86_64 + aarch64 native runners
  # ------------------------------------------------------------------
  flatpak:
    name: Flatpak (${{ matrix.arch }})
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.only == '' ||
      contains(inputs.only, 'flatpak')
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 (not 22.04 like the AppImage job) so the host
        # ships appstream 1.0+ which provides /usr/bin/appstream-compose.
        # flatpak-builder shells out to that binary at the end of every
        # build to compose AppStream metadata; on 22.04 (appstream 0.15)
        # the binary is absent and flatpak-builder fails with
        # "bwrap: execvp appstream-compose: No such file or directory".
        # Host glibc doesn't matter for Flatpak builds (output runs
        # inside the GNOME Platform sandbox), so bumping the runner
        # has no compat downside, unlike the AppImage matrix.
        include:
          - { arch: x86_64,  runs-on: ubuntu-24.04 }
          - { arch: aarch64, runs-on: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install flatpak + flatpak-builder + GNOME runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder gettext-base
          flatpak remote-add --user --if-not-exists flathub \
              https://flathub.org/repo/flathub.flatpakrepo
          # Read GNOME_RUNTIME_VERSION from versions.env so this stays
          # in sync with whatever the manifest pins.
          set -a; . packaging/linux/versions.env; set +a
          flatpak install --user --noninteractive flathub \
              "org.gnome.Platform//${GNOME_RUNTIME_VERSION}" \
              "org.gnome.Sdk//${GNOME_RUNTIME_VERSION}"
      # flatpak-builder's `--ccache` (passed by packaging/linux/build.sh)
      # honours the host CCACHE_DIR env var when it's an absolute path
      # (see builder_context_init_ccache in flatpak-builder/src/builder-context.c).
      # The top-level env block sets CCACHE_DIR to ${workspace}/.ccache,
      # so flatpak-builder writes its ccache state to the same shared
      # path the other jobs use.
      - name: Restore flatpak-builder ccache
        if: github.event_name != 'workflow_call'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-flatpak-${{ matrix.arch }}-ccache-${{ hashFiles('**/CMakeLists.txt', 'cmake/**', 'packaging/linux/flatpak/**.yml.in') }}
          restore-keys: ${{ runner.os }}-flatpak-${{ matrix.arch }}-ccache-
      # flatpak-builder compiles inside the build sandbox, which CCACHE_MAXSIZE
      # does not reach, so ccache applied its own 5 GB default and the x86_64
      # entry had grown to 4.4 GB of the repository's 10 GB budget -- evicting
      # the caches every other job depends on. max_size in the cache's own
      # config travels with it and is read wherever ccache runs. One build
      # writes ~350 MB, so 1 GB keeps the current generation and two behind it.
      - name: Cap the flatpak-builder ccache
        run: |
          mkdir -p "$CCACHE_DIR"
          echo "max_size = 1.0G" > "$CCACHE_DIR/ccache.conf"
      - name: Build Flatpak
        run: packaging/linux/build.sh flatpak
      - name: Save flatpak-builder ccache
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: ./.github/actions/cache-save-newest
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-flatpak-${{ matrix.arch }}-ccache-${{ github.run_id }}
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-${{ matrix.arch }}
          path: dist/aMule-*-Linux-*.flatpak
          if-no-files-found: error

  # ------------------------------------------------------------------
  # macOS — native arm64 + x86_64 builds, then lipo-merge to Universal2
  # ------------------------------------------------------------------
  macos-build:
    name: macOS .app (${{ matrix.arch }})
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.only == '' ||
      contains(inputs.only, 'macos')
    # Both arches build on macos-15 (Apple Silicon) — the legacy
    # macos-13 (Intel) runner is being retired by GitHub and has been
    # flaky for months. The x86_64 build uses Rosetta: a parallel Intel
    # Homebrew install at /usr/local supplies x86_64 dep bottles, and
    # every command that produces x86_64 output is wrapped in
    # `arch -x86_64`. CMake honours MACOS_ARCHITECTURES from the env
    # (handled in packaging/macos/build.sh) so clang emits the right
    # slice. End result is identical to a native Intel build, with the
    # benefit of running on a much beefier ARM host.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            archcmd: ''
            brew_prefix: /opt/homebrew
          - arch: x86_64
            archcmd: 'arch -x86_64'
            brew_prefix: /usr/local
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Bootstrap x86_64 Homebrew (Rosetta)
        if: matrix.arch == 'x86_64'
        run: |
          # Apple Silicon runners ship Rosetta preinstalled. Install
          # x86_64 Homebrew at /usr/local so we can fetch x86_64 bottles
          # for our deps. The native /opt/homebrew install is left alone.
          #
          # Pinned rather than HEAD: as of 2026-09-11 install.sh aborts
          # with "Homebrew on macOS is only supported on Apple Silicon
          # processors!" before it creates the prefix, so HEAD cannot
          # bootstrap this leg at all. df3c2556 is the last commit that
          # still installs to /usr/local. A pinned ref also removes a
          # fetch-HEAD-and-pipe-to-bash hazard.
          REF=df3c2556141c012eaba0453ede7a1bd4f05b824c
          arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/$REF/install.sh)"
      - name: Update Homebrew
        run: ${{ matrix.archcmd }} ${{ matrix.brew_prefix }}/bin/brew update
      # Homebrew is retiring Intel macOS, and a formula loses its Intel
      # bottle the moment it is next revised, publishing arm64_* macOS
      # tags only (plus x86_64_linux, a Linuxbrew ELF build unusable on
      # a Mac). `brew install` then aborts with "no bottle available!"
      # before reaching the rest of the list, so every formula that has
      # lost its Intel bottle is built from source here instead.
      #
      # Pouring the last published Intel bottle by hand looks tempting
      # and does not work: bottles carry @@HOMEBREW_PREFIX@@ in every
      # install name, and Homebrew rewrites that during its own pour
      # with a Mach-O edit plus a re-sign. An untarred bottle is broken,
      # silently, until something tries to link against it.
      #
      # pkgconf is in the list as a build dependency, not a runtime one:
      # aom, libmaxminddb and wxwidgets all need it to build and it has
      # no Intel bottle either, so leaving it implicit risks the same
      # "no bottle available!" abort one level down.
      #
      # Building costs upwards of an hour, so the kegs are cached and
      # only a version bump pays it again. One list drives what is
      # archived and the relink below, so they cannot drift apart.
      #
      # What is cached is one archive, at a path that never changes.
      # actions/cache versions an entry by the hash of its `path` input,
      # and a version mismatch is not something `restore-keys` can fall
      # back through -- so while the paths were generated per formula,
      # extending KEGS orphaned every saved entry and the next run
      # compiled the whole list from source. Packing into one fixed file
      # holds the version still: KEGS decides only what goes inside, so
      # adding a formula costs that formula's own build and nothing else.
      - name: Resolve x86_64 source-built versions
        id: intelkegs
        if: matrix.arch == 'x86_64'
        run: |
          # Every formula in the dependency closure that Homebrew publishes no Intel bottle
          # for, and that a build actually installs. From gettext on, these were found by
          # timing the 3.1.0 release build, where they compiled on every run because the
          # cache never covered them: gettext alone was 69m30s, webp 6m10s, libpng 5m30s.
          # The audit step after the install names anything else that drifts into this set.
          KEGS="pcre2 openssl@3 aom jpeg-turbo json-c libmaxminddb libtiff libupnp lz4 pkgconf wxwidgets xz readline mpdecimal libvmaf gettext libpng webp xxhash giflib libunistring ninja"
          ${{ matrix.archcmd }} ${{ matrix.brew_prefix }}/bin/brew info --json=v2 $KEGS \
              > "$RUNNER_TEMP/kegs.json"
          python3 - "$RUNNER_TEMP/kegs.json" "$RUNNER_TEMP/kegpaths" "$GITHUB_OUTPUT" <<'EOF'
          import json, sys
          formulae = json.load(open(sys.argv[1]))["formulae"]
          # Relative, for `tar -C /`. The pack step drops whatever is not on disk.
          with open(sys.argv[2], "w") as out:
              for f in formulae:
                  out.write("usr/local/Cellar/%s\n" % f["name"])
                  # Aliases and old names get an opt link too, and the build
                  # shims go through those: pkg-config, never pkgconf.
                  for n in [f["name"], *f.get("aliases", []), *f.get("oldnames", [])]:
                      out.write("usr/local/opt/%s\n" % n)
          with open(sys.argv[3], "a") as out:
              out.write("kegs=%s\n" % " ".join(f["name"] for f in formulae))
              # Keg-only formulae stay out of /usr/local; readline would shadow libedit.
              out.write("linkable=%s\n" % " ".join(f["name"] for f in formulae if not f["keg_only"]))
          EOF
      - name: Restore x86_64 source-built kegs
        id: kegcache
        if: matrix.arch == 'x86_64' && github.event_name != 'workflow_call'
        uses: actions/cache/restore@v6
        with:
          path: ~/intel-kegs.tar
          # Keyed by run like ccache, so the newest set is always what restores
          # and retention prunes the rest. Which kegs are stale is not the key's
          # job: `brew install` below upgrades only what is outdated, along with
          # any dependent Homebrew marks for a rebuild.
          key: ${{ runner.os }}-macos-intel-kegtar-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-macos-intel-kegtar-
      - name: Unpack restored kegs
        if: matrix.arch == 'x86_64' && steps.kegcache.outputs.cache-matched-key != ''
        run: tar -C / -xpf ~/intel-kegs.tar
      - name: Install Homebrew deps
        run: |
          BREW=${{ matrix.brew_prefix }}/bin/brew
          MAINDEPS="cmake wxwidgets cryptopp libupnp gd gettext boost dylibbundler libmaxminddb ccache"
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
              SRCBUILD="${{ steps.intelkegs.outputs.kegs }}"
              # Several of these build against a Homebrew python, whose bin names
              # (python3, pip3, idle3) are already symlinks to the python.org
              # framework in /usr/local/bin. Its link step fails, and brew carries
              # that into the exit status of the whole install even though every
              # keg built -- which under bash -e ends the step. Only x86_64
              # collides: arm64 brew lives in /opt/homebrew.
              #
              # Before any install, because which formula drags python in depends
              # on what the cache restored: warm it is gd, cold it is aom, and aom
              # is in the first install below. Resolved over both lists rather than
              # pinned, so a python bump does not quietly bring this back. The
              # install may fail on the very conflict being settled, so the link is
              # what is checked.
              for p in $(${{ matrix.archcmd }} $BREW deps --union --include-build $SRCBUILD $MAINDEPS | grep '^python@' || true); do
                  ${{ matrix.archcmd }} $BREW install "$p" || true
                  ${{ matrix.archcmd }} $BREW link --overwrite "$p"
              done
              # A restored keg has no /usr/local/{lib,include} symlinks and no
              # alias opt links -- only the Cellar and opt paths are cached --
              # so relink or dependents will not find the headers. openssl@3 is
              # found through its opt path, which is cached. The -d guard skips
              # what a cold cache has not installed yet.
              relink() {
                  for f in ${{ steps.intelkegs.outputs.linkable }}; do
                      [ "$f" = "openssl@3" ] && continue
                      [ -d "${{ matrix.brew_prefix }}/Cellar/$f" ] || continue
                      ${{ matrix.archcmd }} $BREW link --overwrite "$f"
                  done
              }
              # Before the install as well: whatever the cache restored stale
              # compiles here, and configure reaches pkgconf through the shim's
              # opt/pkg-config -- an alias link only `brew link` restores.
              relink
              # What the restored set is missing or has outdated: the only
              # formulae the install below will compile.
              ${{ matrix.archcmd }} $BREW outdated $SRCBUILD || true
              # No-op for each keg the cache restored at the current version.
              ${{ matrix.archcmd }} $BREW install --build-from-source $SRCBUILD
              relink
          fi
          # NOT --quiet: when the next formula loses its Intel bottle,
          # the reason has to be in the log. It was suppressed here, so
          # this step failed with a bare exit 1 and the breakage only
          # surfaced two steps later as "ccache: command not found".
          ${{ matrix.archcmd }} $BREW install $MAINDEPS
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
              # An upgrade leaves the old version beside the new one in Cellar;
              # drop it so the saved cache does not grow with every bump.
              ${{ matrix.archcmd }} $BREW cleanup $SRCBUILD
          fi
          # Prepend the matrix-selected brew prefix to PATH so every
          # `brew --prefix` / `cmake` / `pkg-config` invocation in the
          # build script resolves against the right install. gettext
          # is keg-only on macOS; add msgfmt to PATH for the NLS probe.
          echo "${{ matrix.brew_prefix }}/bin" >> "$GITHUB_PATH"
          echo "${{ matrix.brew_prefix }}/opt/gettext/bin" >> "$GITHUB_PATH"
      # A formula loses its Intel bottle the day Homebrew stops publishing one, and the
      # first symptom is a build that takes an extra hour for no visible reason. Homebrew
      # records how each keg arrived, so ask it rather than reading the log: anything it
      # compiled that the cache does not carry is named here, and the next run keeps
      # paying for it until KEGS above is extended.
      - name: Audit what was built from source but is not cached
        if: matrix.arch == 'x86_64'
        run: |
          ${{ matrix.archcmd }} ${{ matrix.brew_prefix }}/bin/brew info --json=v2 --installed \
              > "$RUNNER_TEMP/installed.json"
          python3 - "$RUNNER_TEMP/installed.json" <<'EOF'
          import json, sys
          cached = set("${{ steps.intelkegs.outputs.kegs }}".split())
          built = sorted(
              f["name"]
              for f in json.load(open(sys.argv[1]))["formulae"]
              for i in f.get("installed", [])
              if i.get("poured_from_bottle") is False
          )
          missing = [n for n in built if n not in cached]
          print("built from source: " + (" ".join(built) or "(none)"))
          if missing:
              print("::warning::source-built but not cached, so it recompiles every run: "
                    + " ".join(missing) + " -- add them to KEGS in "
                    "packaging.yml; the cache survives the change")
          else:
              print("every source-built formula is covered by the cache")
          EOF

      # Not gated on master like the save below: a pull request run has to fail
      # here if this breaks, rather than on the merge that has no cache left.
      - name: Pack x86_64 source-built kegs
        if: matrix.arch == 'x86_64'
        run: |
          # An opt link Homebrew did not create for an alias, or a keg the install
          # skipped, is simply absent, and tar fails on a name it cannot find.
          : > "$RUNNER_TEMP/kegtar.list"
          while IFS= read -r p; do
              if [ -e "/$p" ] || [ -L "/$p" ]; then
                  printf '%s\n' "$p" >> "$RUNNER_TEMP/kegtar.list"
              fi
          done < "$RUNNER_TEMP/kegpaths"
          tar -C / -cf ~/intel-kegs.tar -T "$RUNNER_TEMP/kegtar.list"
      - name: Save x86_64 source-built kegs
        # Master only, as for ccache: retention compares keys across branches,
        # and a branch-scoped entry that ranked newest would cost master its own.
        if: matrix.arch == 'x86_64' && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: ./.github/actions/cache-save-newest
        with:
          path: ~/intel-kegs.tar
          key: ${{ runner.os }}-macos-intel-kegtar-${{ github.run_id }}
      - name: Restore ccache
        if: github.event_name != 'workflow_call'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-macos-${{ matrix.arch }}-ccache-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
          restore-keys: ${{ runner.os }}-macos-${{ matrix.arch }}-ccache-
      - name: Zero ccache stats
        if: github.event_name != 'workflow_call'
        run: ccache --zero-stats
      - name: Build native-arch .app
        env:
          MACOS_ARCHITECTURES: ${{ matrix.arch }}
        run: ${{ matrix.archcmd }} packaging/macos/build.sh
      - name: Smoke-test amuled --version
        run: |
          # Mount the produced .dmg at a fixed path. The volume name
          # contains spaces (e.g. "aMule 2.3.3-foo"), and parsing it
          # out of hdiutil's tabular output is fragile — supply
          # -mountpoint instead.
          DMG=$(ls dist/aMule-*-macOS.dmg | head -1)
          MNT=/tmp/amulemnt
          mkdir -p "${MNT}"
          hdiutil attach -nobrowse -mountpoint "${MNT}" "${DMG}"
          # x86_64 binaries on Apple Silicon run via Rosetta automatically
          # (no explicit arch prefix needed for execution), but be
          # consistent. amuled --version exits 255 (wxApp::OnInit returns
          # false after printing version → wxEntry returns -1). Check the
          # banner via grep instead of relying on exit code. Pattern
          # accepts the dev placeholder ("aMuleD GIT ...") and any
          # tagged-release banner ("aMuleD 3.0.0 ...", etc.).
          ${{ matrix.archcmd }} "${MNT}/aMule.app/Contents/MacOS/amuled" --version 2>&1 | grep -q '^aMuleD '
          # Sanity-check that aMuleGUI.app (the remote-GUI client) is
          # also at the dmg root — packaging/macos/build.sh stages it
          # next to aMule.app via make_dmg, so its absence would mean
          # BUILD_REMOTEGUI didn't actually produce a bundle.
          [ -d "${MNT}/aMuleGUI.app" ] || { echo "aMuleGUI.app missing from per-arch dmg" >&2; exit 1; }
          hdiutil detach "${MNT}"
      - name: Save ccache
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: ./.github/actions/cache-save-newest
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-macos-${{ matrix.arch }}-ccache-${{ github.run_id }}
      - name: ccache stats
        if: always() && github.event_name != 'workflow_call'
        run: ccache --show-stats
      - uses: actions/upload-artifact@v7
        with:
          # Upload the produced .app tree (not the .dmg) so the merge
          # job can lipo-merge mach-o files. The final lipo'd .app gets
          # re-wrapped into a Universal2 .dmg in the merge job.
          name: macos-app-${{ matrix.arch }}
          path: build-macos/src/aMule.app
          if-no-files-found: error
          # Preserve symlinks + permissions inside the .app.
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          # aMuleGUI.app is a separate bundle (the remote-GUI client);
          # uploaded alongside aMule.app so the merge job can lipo it
          # the same way and ship both in the Universal2 .dmg.
          name: macos-gui-${{ matrix.arch }}
          path: build-macos/src/aMuleGUI.app
          if-no-files-found: error
          retention-days: 1

  macos-universal2:
    name: macOS Universal2 .dmg
    needs: macos-build
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.only == '' ||
      contains(inputs.only, 'macos')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          # Need tags so `git describe --tags` in the .dmg name resolves
          # to the release tag (aMule-3.0.1-macOS-universal2.dmg). Without
          # this the checkout is shallow with no tags and describe falls
          # back to --always (the short SHA), producing a SHA-named dmg.
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: macos-app-arm64
          path: arm64.app
      - uses: actions/download-artifact@v8
        with:
          name: macos-app-x86_64
          path: x86_64.app
      - uses: actions/download-artifact@v8
        with:
          name: macos-gui-arm64
          path: arm64-gui.app
      - uses: actions/download-artifact@v8
        with:
          name: macos-gui-x86_64
          path: x86_64-gui.app
      - name: lipo-merge into Universal2 .app bundles
        run: |
          # Merges two per-arch .app bundles (BASE = arm64, OTHER =
          # x86_64) into a Universal2 OUT bundle. Uses the arm64 .app
          # as the base layout; for every Mach-O file inside it, runs
          # lipo-create with the matching x86_64 sibling. Side files
          # (Info.plist, .icns, locale catalogs) are arch-agnostic
          # and inherited from arm64 unchanged.
          merge_app() {
              local BASE="$1"
              local OTHER="$2"
              local OUT="$3"
              cp -R "${BASE}" "${OUT}"
              local rel local_arm local_x86
              while IFS= read -r -d '' rel; do
                  local_arm="${BASE}/${rel}"
                  local_x86="${OTHER}/${rel}"
                  if file "${local_arm}" | grep -q "Mach-O" && [ -f "${local_x86}" ]; then
                      lipo -create -output "${OUT}/${rel}" "${local_arm}" "${local_x86}"
                      # `lipo -create -output` writes the new file with the
                      # process umask (default 022 -> rw-r--r--), discarding
                      # the executable bit on the source. macOS launchd then
                      # refuses to spawn the bundle with errno 13 (EACCES)
                      # because access(X_OK) on the main exec fails. Restore
                      # the executable bit so launchd can spawn the binary.
                      chmod +x "${OUT}/${rel}"
                  fi
              done < <(cd "${BASE}" && find . -type f -print0 | sed 's|^\./||g')
              # Re-apply ad-hoc signatures to every nested Mach-O. clang on
              # Apple Silicon emits ad-hoc-signed binaries by default; lipo
              # invalidates those signatures on merge, and macOS amfid then
              # refuses to load the resulting fat binary. `codesign --force
              # --deep --sign -` rewrites valid ad-hoc sigs across the whole
              # bundle. Required even before notarization for the binary to
              # launch at all on Apple Silicon.
              codesign --force --deep --sign - "${OUT}"
          }
          merge_app arm64.app     x86_64.app     aMule.app
          merge_app arm64-gui.app x86_64-gui.app aMuleGUI.app
      - name: Build Universal2 .dmg
        run: |
          VERSION=$(git describe --tags --always)
          mkdir -p dist
          STAGE=$(mktemp -d)
          cp -R aMule.app    "${STAGE}/"
          cp -R aMuleGUI.app "${STAGE}/"
          ln -s /Applications "${STAGE}/Applications"
          packaging/macos/create-dmg.sh "aMule ${VERSION}" "${STAGE}" \
              "dist/aMule-${VERSION}-macOS-universal2.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-universal2
          path: dist/aMule-*-macOS-universal2.dmg
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Windows — portable .zip for x64 (CLANG64) and ARM64 (CLANGARM64).
  #
  # Both arches are clang + UCRT so there is one Windows toolchain to reason
  # about, and a Windows-specific bug reproduces the same on either. x64 moved
  # off MINGW64 because wxWidgets 3.3 is not packaged for that environment --
  # MSYS2 ships it only for clang-x86_64, clang-aarch64 and ucrt-x86_64 -- and
  # 3.3 is what makes the app follow the system light/dark appearance.
  # ------------------------------------------------------------------
  windows-zip:
    name: Windows portable .zip (${{ matrix.arch }})
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.only == '' ||
      contains(inputs.only, 'windows')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            msystem: CLANG64
            runs-on: windows-2025
            pkg_prefix: mingw-w64-clang-x86_64
          - arch: arm64
            msystem: CLANGARM64
            runs-on: windows-11-arm
            pkg_prefix: mingw-w64-clang-aarch64
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            ${{ matrix.pkg_prefix }}-boost
            ${{ matrix.pkg_prefix }}-ccache
            ${{ matrix.pkg_prefix }}-cmake
            ${{ matrix.pkg_prefix }}-crypto++
            ${{ matrix.pkg_prefix }}-gettext
            ${{ matrix.pkg_prefix }}-libgd
            ${{ matrix.pkg_prefix }}-libmaxminddb
            ${{ matrix.pkg_prefix }}-make
            ${{ matrix.pkg_prefix }}-ninja
            ${{ matrix.pkg_prefix }}-pkgconf
            ${{ matrix.pkg_prefix }}-readline
            ${{ matrix.pkg_prefix }}-toolchain
            ${{ matrix.pkg_prefix }}-wxwidgets3.3-msw
            ${{ matrix.pkg_prefix }}-zlib
            git
            zip
      - name: Restore ccache
        if: github.event_name != 'workflow_call'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-windows-${{ matrix.arch }}-ccache-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
          restore-keys: ${{ runner.os }}-windows-${{ matrix.arch }}-ccache-
      - name: Zero ccache stats
        if: github.event_name != 'workflow_call'
        run: ccache --zero-stats
      - name: Configure git safe.directory for MSYS2 git
        # MSYS2 git (now installed above) uses a global config separate
        # from the Windows git at C:\Program Files\Git\bin\git.exe that
        # actions/checkout configures. Without this entry, MSYS2 git
        # may trip the "dubious ownership" guard on the workspace dir,
        # which would cause `git describe --tags` inside
        # packaging/windows/build.sh to fall through the `2>/dev/null
        # || echo "snapshot"` fallback and produce
        # aMule-snapshot-Windows-*.zip instead of
        # aMule-<tag>-Windows-*.zip.
        run: git config --global --add safe.directory '*'
      # MSYS2 only packages pupnp 1.14.x; build the pinned 22.x from source so
      # the Windows portable gets the UPnP fixes released in 22.0.4 (issue
      # #242). Installed into $MINGW_PREFIX so find_package(UPNP CONFIG) picks
      # it up and build.sh's dependency bundling ships the 22.x DLL.
      - name: Build libupnp (pupnp) from source
        run: |
          set -euo pipefail
          . packaging/linux/versions.env
          curl -L -o /tmp/libupnp.tar.gz "$LIBUPNP_TARBALL_URL"
          echo "$LIBUPNP_SHA256  /tmp/libupnp.tar.gz" | sha256sum -c -
          mkdir -p /tmp/libupnp
          tar -xf /tmp/libupnp.tar.gz -C /tmp/libupnp --strip-components=1
          cmake -S /tmp/libupnp -B /tmp/libupnp/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DUPNP_BUILD_SHARED=ON -DUPNP_BUILD_STATIC=OFF \
            -DUPNP_BUILD_SAMPLES=OFF -DUPNP_BUILD_TESTS=OFF -Dreuseaddr=ON -Dipv6=ON \
            -DCMAKE_INSTALL_PREFIX="$MINGW_PREFIX"
          cmake --build /tmp/libupnp/build
          cmake --install /tmp/libupnp/build
      - name: Build portable .zip
        env:
          WINDOWS_MSYSTEM: ${{ matrix.msystem }}
        run: packaging/windows/build.sh
      - name: Smoke-test amuled.exe --version
        run: |
          # Two layered quirks here:
          # 1. amuled.exe --version exits 255 (wxApp::OnInit returns
          #    false after banner → wxEntry returns -1). || true
          #    swallows that.
          # 2. Piping `amuled.exe ... | grep -q` on MSYS2 bash exits
          #    127: grep -q closes its pipe end at first match,
          #    amuled.exe gets SIGPIPE on its next stdout flush, MSYS2
          #    surfaces that as 127. Capture to a file first, then
          #    grep the file — no pipe race.
          ./amule-portable-${{ matrix.arch }}/bin/amuled.exe --version \
              > /tmp/version.txt 2>&1 || true
          cat /tmp/version.txt
          # Pattern accepts the dev placeholder ("aMuleD GIT ...") and
          # any tagged-release banner ("aMuleD 3.0.0 ...", etc.).
          grep -q '^aMuleD ' /tmp/version.txt
      - name: Save ccache
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: ./.github/actions/cache-save-newest
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-windows-${{ matrix.arch }}-ccache-${{ github.run_id }}
      - name: ccache stats
        if: always() && github.event_name != 'workflow_call'
        run: ccache --show-stats
      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: dist/aMule-*-Windows-${{ matrix.arch }}.zip
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Windows — NSIS installer .exe for x64 and ARM64.
  #
  # msystem here is only the shell the job runs in: the step installs bare
  # git/unzip/python and wraps an already-built payload, so it needs no
  # compiler and does not have to match the environment windows-zip built in.
  # Consumes the portable tree built by windows-zip rather than building
  # it a second time. Coupling is correct here: with no payload there's
  # nothing to wrap, so a windows-zip failure should skip the installer.
  # ------------------------------------------------------------------
  windows-installer:
    name: Windows installer .exe (${{ matrix.arch }})
    needs: windows-zip
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.only == '' ||
      contains(inputs.only, 'windows')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            msystem: MINGW64
            runs-on: windows-2025
          - arch: arm64
            msystem: CLANGARM64
            runs-on: windows-11-arm
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up MSYS2
        # Bare bash + git + unzip is all we need — the payload is
        # already-built, so no compiler / wxwidgets / cmake required.
        # `python` is for packaging/windows/build.sh installer's
        # po-to-nsh bridge (generates the per-language LangString
        # block from po/<lang>.po before makensis runs).
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: git unzip python
      - name: Install NSIS
        # NSIS isn't packaged for every MSYS2 environment (e.g. no
        # clangarm64 build), so install the Windows-native NSIS via
        # Chocolatey if it isn't already preinstalled on the runner.
        # The NSIS toolchain itself runs fine under x64 emulation on
        # Windows-on-ARM — it's a build tool, not a runtime payload.
        # build.sh installer auto-discovers makensis at the standard
        # install dir, so no $GITHUB_PATH plumbing is needed.
        shell: pwsh
        run: |
          # choco exits 0 when the community feed is unreachable ("Unable to
          # find package 'nsis'" after a 504), so the missing tool only
          # surfaces two steps later as "makensis not on PATH". Verify what
          # actually landed, at the paths build.sh searches, and retry the
          # outage rather than trusting the exit code.
          $nsis = @(
            "C:\Program Files (x86)\NSIS\makensis.exe",
            "C:\Program Files\NSIS\makensis.exe"
          )
          foreach ($attempt in 1..3) {
            if ($nsis | Where-Object { Test-Path $_ }) { break }
            if ($attempt -gt 1) {
              Write-Host "NSIS still missing, retrying in 20s (attempt $attempt/3)"
              Start-Sleep -Seconds 20
            }
            choco install -y --no-progress nsis
          }
          $found = $nsis | Where-Object { Test-Path $_ }
          if (-not $found) {
            throw "NSIS install reported success but makensis.exe is at neither $($nsis -join ' nor ')"
          }
          Write-Host "makensis: $($found[0])"
      - name: Configure git safe.directory for MSYS2 git
        run: git config --global --add safe.directory '*'
      - name: Download portable .zip from windows-zip job
        uses: actions/download-artifact@v8
        with:
          name: windows-${{ matrix.arch }}
          path: dist/
      - name: Unzip portable tree
        # The .zip root is amule-portable-<arch>/, which is exactly
        # where build.sh installer expects to find PORTABLE_DIR.
        run: |
          cd "${GITHUB_WORKSPACE}"
          unzip -q "dist/aMule-"*"-Windows-${{ matrix.arch }}.zip"
          test -x "amule-portable-${{ matrix.arch }}/bin/amule.exe"
      - name: Build installer .exe
        env:
          WINDOWS_MSYSTEM: ${{ matrix.msystem }}
        run: packaging/windows/build.sh installer
      - name: Smoke-test installer (silent install + uninstall)
        shell: cmd
        run: |
          for %%F in (dist\aMule-*-Windows-Setup-${{ matrix.arch }}.exe) do set INSTALLER=%%F
          echo Installer: %INSTALLER%
          rem /S = silent, /D=<path> = install dir (NSIS quirk: must be
          rem the LAST argument and unquoted, even with spaces).
          "%INSTALLER%" /S /D=C:\amule-installtest
          if not exist "C:\amule-installtest\bin\amule.exe" (
            echo amule.exe missing after silent install
            exit /b 1
          )
          if not exist "C:\amule-installtest\Uninstall.exe" (
            echo Uninstall.exe missing after silent install
            exit /b 1
          )
          rem _? keeps the uninstaller from spawning a copy of itself
          rem in %TEMP% and returning before the work is done.
          "C:\amule-installtest\Uninstall.exe" /S _?=C:\amule-installtest
          rem The uninstaller cannot delete itself while running; clean
          rem the leftover stub here so the dir-gone assertion is meaningful.
          if exist "C:\amule-installtest\Uninstall.exe" del "C:\amule-installtest\Uninstall.exe"
          rmdir C:\amule-installtest 2>nul
          if exist "C:\amule-installtest\bin" (
            echo Uninstaller left files behind
            exit /b 1
          )
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer-${{ matrix.arch }}
          path: dist/aMule-*-Windows-Setup-${{ matrix.arch }}.exe
          if-no-files-found: error
