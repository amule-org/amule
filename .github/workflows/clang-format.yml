name: clang-format

on:
  push:
    branches: [ "**" ]
    paths:
      - 'src/**'
      - 'unittests/**'
      - '.clang-format'
      - '.github/workflows/clang-format.yml'
  pull_request:
    branches: [ "**" ]
    paths:
      - 'src/**'
      - 'unittests/**'
      - '.clang-format'
      - '.github/workflows/clang-format.yml'

permissions:
  contents: read

jobs:
  clang-format:
    name: Check clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check src/
        uses: jidicula/clang-format-action@v4.18.0
        with:
          clang-format-version: '18'
          check-path: 'src'
          # src/extern holds vendored third-party code, kept byte-identical to
          # a pinned upstream commit and carrying a no-local-patches rule (see
          # src/extern/libutp/AMULE_PROVENANCE.md). Reformatting it to satisfy
          # this check would break that guarantee, so it is excluded instead.
          exclude-regex: '^src/extern/'
      - name: Check unittests/
        uses: jidicula/clang-format-action@v4.18.0
        with:
          clang-format-version: '18'
          check-path: 'unittests'
